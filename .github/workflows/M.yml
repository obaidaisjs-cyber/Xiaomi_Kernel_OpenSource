name: KernelSU-Next redwood Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build KernelSU-Next
    runs-on: ubuntu-22.04

    steps:

      - name: Clone Xiaomi kernel source
        run: |
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel
          cd kernel
          test -d drivers
          test -d arch

      - name: Find redwood config
        run: |
          cd kernel
          find arch -name "redwood*defconfig"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            build-essential \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            libssl-dev \
            libelf-dev \
            pahole \
            python3 \
            zip

      - name: Setup KernelSU-Next
        working-directory: kernel
        run: |
          curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash

      - name: Enable KernelSU
        working-directory: kernel
        run: |
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/redwood_QGKI_defconfig

      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out vendor/redwood_QGKI_defconfig

          make -j$(nproc) O=out

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: redwood-kernel
          path: kernel/out/arch/arm64/boot/Image
