name: Build Poco X5 Pro Redwood Kernel with KernelSU-Next

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            clang \
            lld \
            gcc-aarch64-linux-gnu \
            device-tree-compiler \
            python3 \
            git \
            curl


      - name: Clone Kernel Source
        run: |
          git clone --depth 1 \
          -b redwood-s-oss \
          https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel


      - name: Integrate KernelSU-Next
        run: |
          cd kernel
          curl -LSs \
          https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
          | bash -s legacy


      - name: Merge Config Fragment
        run: |
          cd kernel

          export ARCH=arm64

          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/redwood_QGKI.config
          echo "CONFIG_KPROBES=y" >> arch/arm64/configs/vendor/redwood_QGKI.config
          echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/vendor/redwood_QGKI.config
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/vendor/redwood_QGKI.config


      - name: Disable problematic option
        run: |
          cd kernel

          sed -i '/CONFIG_CORESIGHT_BYTE_CNTR/d' arch/arm64/configs/vendor/redwood_QGKI.config

          echo "# CONFIG_CORESIGHT_BYTE_CNTR is not set" >> arch/arm64/configs/vendor/redwood_QGKI.config


      - name: Build Kernel
        run: |
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out \
          ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          vendor/redwood_QGKI_defconfig


          make O=out \
          ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          KCFLAGS="-Wno-error" \
          -j$(nproc) 2>&1 | tee build_log.txt


          echo "========== Kernel output =========="

          find out/arch/arm64/boot -type f


      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redwood-build-log
          path: kernel/build_log.txt


      - name: Upload Kernel Image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redwood-kernel-files
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/dts/**/*.dtb
          if-no-files-found: warn
