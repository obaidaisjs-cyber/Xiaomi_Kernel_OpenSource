name: KernelSU-Next redwood Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout Kernel Source
      run: |
        git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel
        cd kernel
        git branch -a

    - name: Find redwood config
      run: |
        cd kernel
        find . -name "*redwood*" -o -name "*defconfig*"

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
        bc \
        bison \
        build-essential \
        curl \
        flex \
        gcc-aarch64-linux-gnu \
        libssl-dev \
        libelf-dev \
        pahole \
        python3 \
        zip

    - name: Setup KernelSU-Next
      run: |
        cd kernel
        curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -

    - name: Enable KernelSU
      run: |
        cd kernel
        echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/redwood_QGKI_defconfig

    - name: Build Kernel
      run: |
        cd kernel
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        make O=out vendor/redwood_QGKI_defconfig
        make -j$(nproc) O=out

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: kernel/out/arch/arm64/boot/Image
