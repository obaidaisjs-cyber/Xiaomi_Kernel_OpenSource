name: Check redwood kernel source

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout redwood kernel
      uses: actions/checkout@v4
      with:
        repository: MiCode/Xiaomi_Kernel_OpenSource
        ref: redwood-oss
        fetch-depth: 1
        submodules: recursive

    - name: Verify kernel files
      run: |
        echo "Current directory:"
        pwd

        echo "Listing files:"
        ls -la

        echo "Checking required kernel folders..."

        if [ -d "drivers" ]; then
          echo "drivers/ OK"
        else
          echo "drivers/ MISSING"
          exit 1
        fi

        if [ -d "arch" ]; then
          echo "arch/ OK"
        else
          echo "arch/ MISSING"
          exit 1
        fi

        if [ -f "Makefile" ]; then
          echo "Makefile OK"
        else
          echo "Makefile MISSING"
          exit 1
        fi

        echo "======================"
        echo "Kernel source is OK"
        echo "======================"
