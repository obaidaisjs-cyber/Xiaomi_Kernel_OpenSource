name: Build POCO X5 Pro Redwood KernelSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            flex \
            build-essential \
            clang \
            lld \
            llvm \
            libssl-dev \
            libelf-dev \
            pahole \
            python3 \
            gcc-aarch64-linux-gnu \
            device-tree-compiler \
            curl \
            zip

      - name: Clone Xiaomi Kernel Source
        run: |
          git clone --depth=1 \
          --branch redwood-s-oss \
          https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel

      - name: Check Kernel Source
        run: |
          cd kernel
          echo "Kernel files:"
          ls -la

          echo "Searching redwood config:"
          find arch/arm64/configs -type f | grep -i redwood || true

      - name: Add KernelSU-Next
        run: |
          cd kernel
          curl -LSs \
          https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
          | bash -s legacy

      - name: Enable KernelSU
        run: |
          cd kernel

          CONFIG=$(find arch/arm64/configs -type f | grep -i redwood | head -n 1)

          if [ -z "$CONFIG" ]; then
            echo "No redwood config found"
            exit 1
          fi

          echo "Using config:"
          echo "$CONFIG"

          echo "CONFIG_KSU=y" >> "$CONFIG"
          echo "CONFIG_KPROBES=y" >> "$CONFIG"
          echo "CONFIG_HAVE_KPROBES=y" >> "$CONFIG"
          echo "CONFIG_KPROBE_EVENTS=y" >> "$CONFIG"

      - name: Build Kernel
        run: |
          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          CONFIG=$(find arch/arm64/configs -type f | grep -i redwood | head -n 1)

          DEFCONFIG=$(basename "$CONFIG")

          echo "Building with:"
          echo "$DEFCONFIG"

          make O=out "$DEFCONFIG"

          make O=out \
          ARCH=arm64 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          KCFLAGS="-Wno-error" \
          -j$(nproc)

      - name: Find Kernel Output
        if: always()
        run: |
          cd kernel
          echo "Searching kernel images..."
          find out/arch/arm64/boot -type f || true

      - name: Upload Kernel Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poco-x5-pro-redwood-kernel
          path: kernel/out/arch/arm64/boot/*
          if-no-files-found: warn

      - name: Upload Build Config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-config
          path: kernel/out/.config
          if-no-files-found: warn
