name: KernelSU-Next redwood Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: recursive

    - name: Check kernel source
      run: |
        echo "Checking kernel files..."
        ls
        test -d drivers
        test -d arch
        echo "Kernel source OK"

    - name: Find redwood config
      run: |
        echo "Searching config..."
        find arch/arm64/configs -name "*redwood*"

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
        bc \
        bison \
        build-essential \
        curl \
        flex \
        gcc-aarch64-linux-gnu \
        libssl-dev \
        libelf-dev \
        pahole \
        python3 \
        zip

    - name: Setup KernelSU-Next
      run: |
        curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -

    - name: Enable KernelSU
      run: |
        echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/redwood_QGKI_defconfig

    - name: Build kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-

        make O=out vendor/redwood_QGKI_defconfig

        make -j$(nproc) O=out

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: redwood-kernel-image
        path: out/arch/arm64/boot/Image
