name: KernelSU-Next Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: KernelSU-Next Kernel Build
    runs-on: ubuntu-22.04

    steps:

      - name: Show workflow is active
        run: |
          echo "KernelSU-Next workflow is active"
          date

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show repository
        run: |
          ls -la
          ls arch/arm64/configs/vendor/

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            build-essential \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            libssl-dev \
            libelf-dev \
            pahole \
            python3 \
            git \
            zip

      - name: Setup KernelSU-Next
        run: |
          curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash

      - name: Enable KernelSU
        run: |
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/redwood_QGKI.config

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out vendor/redwood_QGKI_defconfig
          make -j$(nproc) O=out

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-redwood
          path: out/arch/arm64/boot/Image
