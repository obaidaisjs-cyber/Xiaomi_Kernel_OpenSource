name: KernelSU-Next Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    name: KernelSU-Next Build
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: kernelsu-next
          fetch-depth: 1

      - name: Show repository
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          ls -la

          echo "Checking kernel config:"
          ls -la arch/arm64/configs/vendor/

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            build-essential \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            libssl-dev \
            libelf-dev \
            pahole \
            python3 \
            git \
            zip

      - name: Setup KernelSU-Next
        run: |
          cd $GITHUB_WORKSPACE
          curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -

      - name: Enable KernelSU
        run: |
          echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/redwood_QGKI.config

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out vendor/redwood_QGKI_defconfig

          make -j$(nproc) O=out

      - name: Package Image
        run: |
          mkdir -p output
          cp out/arch/arm64/boot/Image output/Image
          gzip -9 output/Image

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-redwood
          path: |
            output/Image.gz
