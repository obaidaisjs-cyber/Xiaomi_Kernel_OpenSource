name: Find Kernel Config

on:
  workflow_dispatch:

jobs:
  find-config:
    name: Find redwood config file
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Xiaomi kernel source
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: redwood-oss
          fetch-depth: 1

      - name: Search for config
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          ls -la

          echo "Searching for redwood_QGKI.config..."
          find . -name "redwood_QGKI.config" -print
